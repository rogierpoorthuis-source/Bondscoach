<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bondscoaches — Pupillenweekend Altius</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080d14;
  --surface: #0d1520;
  --surface2: #111c2d;
  --accent: #ff6a00;
  --accent-light: #ff8c3a;
  --accent-glow: rgba(255,106,0,0.15);
  --accent2: #f59e0b;
  --green: #22c55e;
  --muted: #4a6080;
  --text: #d4e4f7;
  --border: rgba(255,106,0,0.15);
  --border-subtle: rgba(255,255,255,0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; overflow-x: hidden; }
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,106,0,0.02) 60px, rgba(255,106,0,0.02) 61px),
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,106,0,0.02) 60px, rgba(255,106,0,0.02) 61px);
  pointer-events: none; z-index: 0;
}
.container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 36px 16px 80px; }

/* HERO */
.hero { text-align: center; margin-bottom: 36px; }
.hero-badge {
  display: inline-block; background: var(--accent-glow); border: 1px solid var(--border);
  color: var(--accent-light); font-family: 'Oswald', sans-serif; font-size: 10px;
  letter-spacing: 3px; padding: 5px 14px; border-radius: 2px; margin-bottom: 16px; text-transform: uppercase;
}
.hero h1 { font-family: 'Oswald', sans-serif; font-size: clamp(26px, 6vw, 52px); font-weight: 700; line-height: 1.08; color: #fff; text-transform: uppercase; letter-spacing: -0.5px; }
.hero h1 span { color: var(--accent); }
.hero p { margin-top: 10px; color: var(--muted); font-size: 14px; font-weight: 300; }
.cloud-pill { display: inline-block; margin-top: 12px; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border-subtle); color: var(--muted); }
.cloud-pill.live { color: var(--green); border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.06); }
.cloud-pill.offline { color: var(--accent2); border-color: rgba(245,158,11,0.3); }

/* PANEL */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.panel-title {
  font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--accent-light); margin-bottom: 18px;
  display: flex; align-items: center; gap: 8px;
}
.panel-title::before { content: ''; width: 3px; height: 13px; background: var(--accent); border-radius: 2px; flex-shrink: 0; }
.panel-title.gold { color: var(--accent2); }
.panel-title.gold::before { background: var(--accent2); }
.panel-title.green-c { color: var(--green); }
.panel-title.green-c::before { background: var(--green); }

.section-label {
  font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 3px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::after { content:''; flex:1; height:1px; background:var(--border); }

.back-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font-family: 'Barlow', sans-serif; font-size: 13px; padding: 10px 16px;
  border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center;
  gap: 8px; margin-bottom: 28px; transition: all 0.18s; width: 100%; justify-content: center;
}
.back-btn:hover, .back-btn:active { border-color: var(--accent); color: var(--accent); }

/* CONTACT */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 500px) { .contact-grid { grid-template-columns: repeat(3, 1fr); } }
.contact-card {
  background: var(--surface2); border: 1px solid var(--border-subtle);
  border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 4px;
}
.contact-role { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent2); }
.contact-name { font-size: 13px; font-weight: 500; color: var(--text); }
.contact-tel {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--accent-light); text-decoration: none;
  margin-top: 2px; font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.5px;
}
.contact-tel:hover { color: var(--accent); }

/* GAME BUTTONS */
.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 500px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
.game-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 10px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 10px; text-align: center; transition: all 0.18s ease;
  position: relative; overflow: hidden; min-height: 100px; justify-content: center;
}
.game-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,106,0,0.08), transparent 60%);
  opacity: 0; transition: opacity 0.18s;
}
.game-btn:active { transform: scale(0.96); border-color: rgba(255,106,0,0.5); }
.game-btn:active::before, .game-btn:hover::before { opacity: 1; }
@media (hover:hover) { .game-btn:hover { border-color: rgba(255,106,0,0.5); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); } }
.game-icon { font-size: 26px; line-height: 1; }
.game-btn-name { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text); line-height: 1.3; }
.game-progress { font-size: 11px; color: var(--muted); font-weight: 300; }
.game-progress.done { color: var(--green); }

/* RESULTS */
.results-round { margin-bottom: 14px; }
.results-round-header { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.r-time { background: var(--accent-glow); border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; font-size: 10px; color: var(--accent-light); }
.result-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border-subtle); border-radius: 7px; margin-bottom: 5px; }
.result-team { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-team.right { text-align: right; }
.result-score { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; color: var(--accent-light); min-width: 52px; text-align: center; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; }
.result-score.pending { color: var(--muted); font-size: 12px; font-weight: 400; }
.result-game-tag { font-size: 10px; color: var(--muted); white-space: nowrap; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 3px; padding: 2px 6px; }
.results-pauze { text-align: center; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 8px; margin-bottom: 14px; border: 1px dashed var(--border-subtle); border-radius: 6px; opacity: 0.7; }

/* MAP */
.map-wrapper { width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,106,0,0.2); }
.map-wrapper img { width: 100%; display: block; border-radius: 10px; }
.map-caption { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; font-style: italic; }

/* SPELREGELS */
.rules-placeholder {
  background: var(--surface2); border: 1px dashed rgba(255,106,0,0.25);
  border-radius: 8px; padding: 24px 16px; text-align: center;
}
.rules-placeholder-icon { font-size: 32px; margin-bottom: 10px; }
.rules-placeholder-title { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.rules-placeholder-sub { font-size: 12px; color: var(--muted); font-weight: 300; opacity: 0.7; }
/* RULES CONTENT */
.rules-text { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 12px; font-weight: 300; }
.rules-points { background: var(--surface2); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
.rules-points-title { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.rules-point { font-size: 13px; color: var(--text); padding: 4px 0; display: flex; align-items: center; gap: 8px; }
.rules-point::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }
.rules-score { background: rgba(34,197,94,0.07); border: 1px solid rgba(34,197,94,0.25); border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.5; color: var(--text); margin-top: 4px; }
.rules-score-label { display: block; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }

/* GAME PAGE */
.game-page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.game-page-icon { font-size: 44px; line-height: 1; }
.game-page-title h2 { font-family: 'Oswald', sans-serif; font-size: clamp(22px, 5vw, 36px); font-weight: 700; text-transform: uppercase; color: #fff; line-height: 1; }
.game-page-title p { color: var(--accent-light); font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; margin-top: 5px; font-family: 'Oswald', sans-serif; }

/* MATCH CARD (clickable) */
.entry-match { background: var(--surface2); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 16px; margin-bottom: 10px; }
.entry-match.clickable { width: 100%; text-align: left; cursor: pointer; font-family: inherit; color: inherit; transition: all 0.15s ease; display: block; }
.entry-match.clickable:active { transform: scale(0.99); border-color: var(--accent); }
@media (hover:hover) { .entry-match.clickable:hover { border-color: rgba(255,106,0,0.4); } }
.entry-match.locked { border-color: rgba(34,197,94,0.22); }
.entry-match.locked.clickable:active { border-color: var(--green); }
.entry-match-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.entry-ronde { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.entry-time { font-family: 'Oswald', sans-serif; font-size: 11px; color: var(--accent-light); background: var(--accent-glow); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
.entry-teams-view { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.entry-team { font-size: 14px; font-weight: 500; color: var(--text); }
.entry-team.right { text-align: right; }
.entry-scorebox {
  font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700;
  color: var(--accent-light); min-width: 64px; text-align: center;
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px;
}
.entry-scorebox.empty { color: var(--muted); font-size: 14px; font-weight: 400; }
.entry-match.locked .entry-scorebox { color: var(--green); border-color: rgba(34,197,94,0.3); }
.entry-status { text-align: center; font-size: 11px; margin-top: 10px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.entry-match.locked .entry-status { color: var(--green); }

@media (max-width: 480px) {
  .entry-team { font-size: 12px; }
}

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(4,7,12,0.82);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.18s ease; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 24px 20px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal-round { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-light); text-align: center; margin-bottom: 20px; }
.m-orgnote {
  display: none; text-align: center; font-size: 11px; color: var(--accent2);
  font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase;
  background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25);
  border-radius: 6px; padding: 8px; margin-bottom: 16px;
}
.m-team { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; color: #fff; text-align: center; margin-bottom: 8px; }
.modal-score {
  display: block; width: 100%; max-width: 150px; margin: 0 auto 16px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  color: #fff; font-family: 'Oswald', sans-serif; font-size: 34px; font-weight: 700;
  text-align: center; padding: 10px; -moz-appearance: textfield;
}
.modal-score:focus { outline: none; border-color: var(--accent); background: rgba(255,106,0,0.06); }
.modal-score::-webkit-outer-spin-button, .modal-score::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.m-vs { text-align: center; color: var(--muted); font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 3px; margin-bottom: 14px; }
.m-err { display:none; text-align:center; color:#ff5d5d; font-size:12px; margin-bottom:12px; }
.m-err.show { display:block; }

.m-confirm-big { text-align: center; font-size: 16px; color: var(--text); margin: 6px 0 4px; line-height: 1.6; }
.m-confirm-big b { font-family: 'Oswald', sans-serif; font-size: 26px; color: var(--accent-light); display: inline-block; margin: 0 6px; vertical-align: middle; }
.m-confirm-q { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 20px; }

.m-locked-icon { text-align: center; font-size: 36px; margin-bottom: 10px; }
.m-locked-title { text-align: center; font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-bottom: 14px; }
.m-locked-score { text-align: center; font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
.m-locked-sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 20px; line-height: 1.5; }

.modal-actions { display: flex; gap: 10px; }
.m-btn {
  flex: 1; border-radius: 10px; padding: 14px; font-family: 'Oswald', sans-serif;
  font-size: 13px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border); transition: all 0.15s;
}
.m-btn.ghost { background: transparent; color: var(--muted); }
.m-btn.ghost:active { border-color: var(--accent); color: var(--accent); }
.m-btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
.m-btn.solid:active { background: var(--accent-light); }
.m-btn.confirm { background: var(--green); border-color: var(--green); color: #06210f; }
.m-btn.confirm:active { filter: brightness(1.1); }
.modal-hint { text-align:center; color:var(--muted); font-size:13px; line-height:1.5; margin-bottom:18px; }

/* ORG BANNER + FAB */
.org-banner {
  display: none; position: sticky; top: 0; z-index: 50;
  align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  background: linear-gradient(90deg, var(--accent-glow), rgba(255,106,0,0.04));
  border-bottom: 1px solid var(--border); color: var(--accent-light);
  font-size: 12px; font-family: 'Oswald', sans-serif; letter-spacing: 1px;
  text-transform: uppercase; padding: 11px 16px; text-align: center;
}
.org-banner.show { display: flex; }
.org-banner button {
  background: var(--accent); border: none; color: #fff; border-radius: 6px;
  padding: 6px 14px; font-family: 'Oswald', sans-serif; font-size: 11px;
  letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
}
.org-fab {
  position: fixed; bottom: 18px; right: 18px; z-index: 60;
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--accent-light); font-size: 20px; cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4); transition: all 0.18s;
}
.org-fab:active { transform: scale(0.92); }
body.org-active .org-fab { background: var(--accent); border-color: var(--accent); }

#page-game { display: none; }
#page-home, #page-saturday { display: none; }

/* LANDING / KEUZE */
.choice-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .choice-grid { grid-template-columns: 1fr 1fr; } }
.choice-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 30px 20px; cursor: pointer; text-align: center; transition: all 0.18s ease;
  position: relative; overflow: hidden; font-family: inherit; color: inherit;
}
.choice-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,106,0,0.10), transparent 65%);
  opacity: 0; transition: opacity 0.18s;
}
.choice-card:active { transform: scale(0.98); }
.choice-card:active::before, .choice-card:hover::before { opacity: 1; }
@media (hover:hover) { .choice-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.45); } }
.choice-icon { font-size: 48px; line-height: 1; }
.choice-day { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-light); margin-top: 16px; }
.choice-name { font-family: 'Oswald', sans-serif; font-size: 21px; font-weight: 700; text-transform: uppercase; color: #fff; margin-top: 6px; line-height: 1.12; }
.choice-sub { font-size: 12px; color: var(--muted); margin-top: 10px; font-weight: 300; }

/* STANDEN — GROOT SCHERM */
#page-standings { display: none; }
#page-standings.proj { max-width: 1400px; }
.proj-entry {
  display: block; width: 100%; margin-top: 14px; background: transparent;
  border: 1px solid var(--border-subtle); color: var(--muted);
  font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 14px; border-radius: 10px; cursor: pointer; transition: all 0.15s;
}
.proj-entry:active, .proj-entry:hover { border-color: var(--accent); color: var(--accent); }
.proj-header { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 24px; gap: 16px; flex-wrap: wrap; }
.proj-title { font-family: 'Oswald', sans-serif; font-size: clamp(24px, 4vw, 44px); font-weight: 700; text-transform: uppercase; color: #fff; letter-spacing: -0.5px; }
.proj-title span { color: var(--accent); }
.proj-fs-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--accent-light); font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
.proj-fs-btn:active { border-color: var(--accent); }
.standings-grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .standings-grid { grid-template-columns: 1fr 1fr; } }
.standings-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
.standings-poule { font-family: 'Oswald', sans-serif; font-size: clamp(18px, 2.4vw, 28px); font-weight: 700; text-transform: uppercase; color: var(--accent-light); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.standings-poule::before { content: ''; width: 5px; height: 22px; background: var(--accent); border-radius: 2px; }
.standings-table { width: 100%; border-collapse: collapse; }
.standings-table th { font-family: 'Oswald', sans-serif; font-size: clamp(11px, 1.2vw, 14px); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 8px 6px; text-align: center; border-bottom: 2px solid var(--border); }
.standings-table th:nth-child(2) { text-align: left; }
.standings-table td { font-family: 'Oswald', sans-serif; font-size: clamp(16px, 1.8vw, 24px); font-weight: 600; color: var(--text); padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.04); }
.standings-table td.st-team { text-align: left; font-weight: 500; }
.standings-table td.st-pos { color: var(--muted); width: 1%; }
.standings-table td.st-pts { color: var(--accent-light); }
.standings-table tbody tr:first-child td.st-pos { color: var(--accent); }
.proj-demo-note { text-align: center; color: var(--accent2); font-size: 13px; margin-top: 22px; padding: 12px; border: 1px dashed rgba(245,158,11,0.3); border-radius: 8px; }
/* DAGSCHEMA */
.sched-row { display: flex; align-items: baseline; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.sched-row:last-child { border-bottom: none; }

function buildRounds(){ return SCHEDULE.map(rd=>({round:rd.round,time:rd.time,pauseAfter:rd.pauseAfter||null,
  matches:GAMES.map((g,gi)=>{const pair=rd.matches[g];if(!pair)return null;return {a:TEAM_IDX[pair[0]],b:TEAM_IDX[pair[1]],gameIdx:gi,sa:null,sb:null};}).filter(Boolean)})); }

function computeStandings(p){ const rows=SAT_POULES[p].map(name=>({name,gp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}));const idx={};rows.forEach((r,i)=>idx[r.name]=i);
  satMatches[p].forEach(m=>{if(m.sa===null||m.sb===null)return;const A=rows[idx[m.a]],B=rows[idx[m.b]];A.gp++;B.gp++;A.gf+=m.sa;A.ga+=m.sb;B.gf+=m.sb;B.ga+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++;A.pts+=3;}else if(m.sb>m.sa){B.w++;A.l++;B.pts+=3;}else{A.d++;B.d++;A.pts++;B.pts++;}});
  rows.forEach(r=>r.gd=r.gf-r.ga);rows.sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.name.localeCompare(y.name));return rows;}
function stand(p,i){const s=computeStandings(p);return s[i]?s[i].name:null;}

];

function koLoser(id){const k=koById(id);const[a,b]=k.resolve();if(k.sa==null||k.sb==null||k.sa===k.sb)return null;return k.sa>k.sb?b:a;}
function koSideLabel(id,side){if(id==='FIN')return side===0?'Winnaar kruisfinale 1':'Winnaar kruisfinale 2';if(id==='P34')return side===0?'Verliezer kruisfinale 1':'Verliezer kruisfinale 2';return 'Nader te bepalen';}

    const players=pm[t]||[], coaches=cm[t]||[];
    h+='<button class="back-btn" style="margin-bottom:18px" onclick="coachBackToGrid()">← Alle landen</button>';
    h+='<div class="game-page-header"><div class="game-page-icon">'+(SAT_FLAGS[t]||'🏳️')+'</div><div class="game-page-title"><h2>'+t+'</h2><p>'+players.length+' spelers · '+coaches.length+' bondscoaches</p></div></div>';
    if(coaches.length){
      h+='<div class="panel"><div class="panel-title gold">Bondscoaches</div><ol class="roster-list">';
      coaches.forEach(c=>{ const naam=(c&&(c.naam||c.name))||c; h+='<li>'+naam+'</li>'; });
      h+='</ol></div>';
    }
    h+='<div class="panel"><div class="panel-title">Spelers</div>';
    if(players.length){
      h+='<ol class="roster-list">';
      players.forEach(p=>{ const naam=(p&&(p.naam||p.name))||p; const cat=(p&&p.cat)?'<span class="roster-cat">'+p.cat+'</span>':''; h+='<li>'+naam+cat+'</li>'; });
      h+='</ol>';
    } else { h+='<p class="rules-text">Nog geen spelers voor dit land.</p>'; }
    h+='</div>';
    return h;
  }

  // Tegelraster
  if(teams.length===0){
    h+='<div class="rules-placeholder"><div class="rules-placeholder-icon">👥</div><div class="rules-placeholder-title">Nog geen spelers</div><div class="rules-placeholder-sub">De organisatie kan de spelers en bondscoaches importeren via de knop onderaan.</div></div>';
    h+='<button class="proj-entry" style="margin-top:18px" onclick="coachOrgUnlock()">🔧 Organisatie</button>';
    return h;
  }
  h+='<div class="games-grid">';
  teams.sort().forEach(t=>{
    const np=(pm[t]||[]).length, nc=(cm[t]||[]).length;
    h+='<button class="game-btn" onclick="coachOpenTeam(\''+t.replace(/\x27/g,"\\\x27")+'\')">'
      +'<div class="game-icon">'+(SAT_FLAGS[t]||'🏳️')+'</div>'
      +'<div class="game-btn-name">'+t+'</div>'
      +'<div class="game-progress">'+np+' spelers'+(nc?(' · '+nc+' coach'+(nc>1?'es':'')):'')+'</div>'
      +'</button>';
  });
  h+='</div>';
  if(!orgUnlocked) h+='<button class="proj-entry" style="margin-top:18px" onclick="coachOrgUnlock()">🔧 Organisatie</button>';
  return h;
}
function coachVrijdagHTML(){ let h='';
  state.rounds.forEach(r=>{ h+='<div class="results-round"><div class="results-round-header">Ronde '+r.round+' <span class="r-time">'+r.time+'</span></div>';
    r.matches.forEach(m=>{const a=player(m.a),b=player(m.b);const done=m.sa!==null&&m.sb!==null;const sc=done?(m.sa+' – '+m.sb):'vs';
      h+='<div class="result-row"><div class="result-team">'+a.flag+' '+a.name+'</div><div class="result-score '+(done?'':'pending')+'">'+sc+'</div><div class="result-team right">'+b.flag+' '+b.name+'</div><div class="result-game-tag">'+GAMES[m.gameIdx]+'</div></div>';});
    h+='</div>'; });
  return h; }
function standingsTableHTML(p){ const rows=computeStandings(p); let body='';
  rows.forEach((r,i)=>{ body+='<tr><td class="st-pos">'+(i+1)+'</td><td class="st-team">'+(SAT_FLAGS[r.name]||'')+' '+r.name+'</td><td>'+r.gp+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+(r.gd>0?'+':'')+r.gd+'</td><td class="st-pts">'+r.pts+'</td></tr>'; });
  return '<div class="standings-card"><div class="standings-poule">Poule '+p+'</div><table class="standings-table"><thead><tr><th>#</th><th>Team</th><th>Wed</th><th>W</th><th>G</th><th>V</th><th>+/-</th><th>Ptn</th></tr></thead><tbody>'+body+'</tbody></table></div>'; }
function koSummaryHTML(){ const rows=koMatches.map(k=>{const sc=(k.sa!==null&&k.sb!==null)?(k.sa+' – '+k.sb):'vs';
    return '<div class="kf-row"><span class="kf-tag">'+k.label+' · '+k.tijd+'</span> '+koTeamLabel(k,0)+' <span class="kf-vs">'+sc+'</span> '+koTeamLabel(k,1)+'</div>';}).join('');
  const champ=koWinner('FIN'); const champLine=champ?('<div class="kf-champ">🏆 Kampioen: '+(SAT_FLAGS[champ]||'')+' '+champ+'</div>'):'';
  return '<div class="kf-block"><div class="kf-title">Knock-out</div>'+rows+champLine+'</div>'; }
function coachZaterdagHTML(){ let h='<div class="standings-grid">'+standingsTableHTML('A')+standingsTableHTML('B')+'</div>'+koSummaryHTML();
  ['A','B'].forEach(p=>{ h+='<div class="results-round-header" style="margin-top:18px">Poule '+p+' — wedstrijden</div>';
    satMatches[p].forEach(m=>{const done=m.sa!==null&&m.sb!==null;const sc=done?(m.sa+' – '+m.sb):'vs';
      h+='<div class="result-row"><div class="result-team">'+(SAT_FLAGS[m.a]||'')+' '+m.a+'</div><div class="result-score '+(done?'':'pending')+'">'+sc+'</div><div class="result-team right">'+(SAT_FLAGS[m.b]||'')+' '+m.b+'</div><div class="result-game-tag">R'+m.r+' · '+m.veld+'</div></div>';});
  });
  return h; }

function coachImportClick(){ document.getElementById('coachFile').click(); }
function canonTeam(raw){
  const s=String(raw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
  const map={ spanje:'Spanje',portugal:'Portugal',marokko:'Marokko',mexico:'Mexico',
    saudiarabie:'Saoedi Arabië',saoediarabie:'Saoedi Arabië',saoudiarabie:'Saoedi Arabië',saoedie:'Saoedi Arabië',
    brazilie:'Brazilië',brazil:'Brazilië',zweden:'Zweden',australie:'Australië',japan:'Japan',
    frankrijk:'Frankrijk',curacao:'Curaçao',argentinie:'Argentinië',
    vs:'Verenigde Staten',verenigdestaten:'Verenigde Staten',usa:'Verenigde Staten',amerika:'Verenigde Staten',
    duitsland:'Duitsland',engeland:'Engeland',nederland:'Nederland' };
  return map[s] || String(raw||'').trim();
}
function coachFileChosen(ev){ const file=ev.target.files[0]; if(!file)return;
  if(typeof XLSX==='undefined'){ alert('Excel-bibliotheek nog niet geladen - probeer het zo nog eens.'); return; }
  const low=k=>String(k).toLowerCase().replace(/[^a-z]/g,'');
  const reader=new FileReader();
  reader.onload=(e)=>{ try{
    const wb=XLSX.read(e.target.result,{type:'array'});
    // ── Tabblad 1: spelers ──
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''}); const players={};
    if(!rows.length){ alert('Het eerste tabblad (spelers) lijkt leeg.'); return; }
    const keys=Object.keys(rows[0]);
    const teamKey=keys.find(k=>['team','land'].includes(low(k)));
    const catKey =keys.find(k=>['categorie','cat','leeftijd'].includes(low(k)));
    let nameKey  =keys.find(k=>['speler','naam','player','voornaam','naamspeler','spelernaam','name'].includes(low(k)));
    if(!nameKey) nameKey=keys.find(k=>k!==teamKey&&k!==catKey);
    if(!teamKey||!nameKey){ alert('Kon de kolommen op tabblad 1 niet herkennen. Zorg voor een kolom Team en een kolom met spelersnamen.'); return; }
    rows.forEach(r=>{ const team=canonTeam(r[teamKey]); const naam=String(r[nameKey]||'').trim(); const cat=catKey?String(r[catKey]||'').trim():'';
      if(!team||!naam)return; (players[team]=players[team]||[]).push(cat?{naam,cat}:{naam}); });
    if(Object.keys(players).length===0){ alert('Geen geldige spelers gevonden op tabblad 1.'); return; }
    // ── Tabblad 2: bondscoaches (kol 1 = land, kol 2 = naam) ──
    const coaches={};
    if(wb.SheetNames[1]){
      const ws2=wb.Sheets[wb.SheetNames[1]];
      const arr=XLSX.utils.sheet_to_json(ws2,{header:1,defval:''});
      arr.forEach((row,idx)=>{
        const land=String(row[0]||'').trim(), naam=String(row[1]||'').trim();
        if(!land||!naam) return;
        if(idx===0 && (low(land)==='land'||low(land)==='team'||low(naam)==='naam'||low(naam)==='coach'||low(naam)==='bondscoach')) return; // koprij overslaan
        const team=canonTeam(land);
        (coaches[team]=coaches[team]||[]).push(naam);
      });
    }
    const out={ players, coaches };
    window.CoachCloud.saveRosters(out).then(()=>{ rosters=out; coachSelectedTeam=null; renderCoachTab();
      alert('Geimporteerd: '+Object.keys(players).length+' landen, '+Object.keys(coaches).length+' met bondscoaches.'); })
      .catch(err=>{ alert('Opslaan mislukt. Ben je ingelogd en kloppen de Firestore-regels? '+err); });
  }catch(err){ alert('Kon het Excel-bestand niet lezen: '+err); } };
  reader.readAsArrayBuffer(file); ev.target.value=''; }

window.applyRemoteCoach=function(data){ if(!data)return;
  state.rounds.forEach(r=>r.matches.forEach(m=>{const d=data[cloudKey(r.round,m.gameIdx)];if(d){m.sa=(d.sa===undefined?null:d.sa);m.sb=(d.sb===undefined?null:d.sb);}}));
  ['A','B'].forEach(p=>satMatches[p].forEach((m,i)=>{const d=data[cloudKeySat(p,i)];if(d){m.sa=(d.sa===undefined?null:d.sa);m.sb=(d.sb===undefined?null:d.sb);}}));
  koMatches.forEach(k=>{const d=data[cloudKeyKo(k.id)];if(d){k.sa=(d.sa===undefined?null:d.sa);k.sb=(d.sb===undefined?null:d.sb);}});
  if(coachLoggedIn) renderCoachTab(); };
window.setCloudStatus=function(t,c){const el=document.getElementById('cloudStatus');if(el){el.textContent=t;el.className='cloud-pill '+(c||'');}};

document.getElementById('coachPw').addEventListener('keydown',e=>{if(e.key==='Enter')coachLogin();});

</script>
